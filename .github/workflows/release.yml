name: Release

# Builds the Linux and Windows packages and attaches them to the GitHub release of a tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v2d)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  package:
    runs-on: ubuntu-22.04 # glibc 2.35 -> the Linux binary runs on Ubuntu 22.04 and newer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            configure: ""
            archive: tar
          - platform: windows
            configure: -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          if [ "${{ matrix.platform }}" = windows ]; then
            sudo apt-get install -y g++-mingw-w64-x86-64-posix
          fi

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSPACE_GARDEN_STATIC_RUNTIME=ON ${{ matrix.configure }}
          # The 3D app exists from v3d on; older tags only have the 2D app.
          TARGETS=space_garden_2d
          if [ -d app3d ]; then TARGETS="space_garden_2d space_garden_3d"; fi
          cmake --build build -j --target $TARGETS

      - name: Test core logic
        if: matrix.platform == 'linux'
        run: |
          cmake --build build -j --target core_tests $( [ -f tests/picking_tests.cpp ] && echo picking_tests )
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          APP=space-garden-2d
          if [ -d app3d ]; then APP=space-garden; fi
          NAME=$APP-${TAG}-${{ matrix.platform }}-x86_64
          DIR=$APP-${{ matrix.platform }}-x86_64
          cmake --install build --prefix "dist/$DIR" --strip
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then zip -qr "$NAME.zip" "$DIR"; else tar czf "$NAME.tar.gz" "$DIR"; fi
          sha256sum "$NAME".* > "$NAME.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" $(ls dist/*.tar.gz dist/*.zip dist/*.sha256 2>/dev/null) --clobber --repo "$GITHUB_REPOSITORY"
          if [ "${{ matrix.platform }}" = linux ]; then
            for shot in docs/screenshots/space-garden-*.png; do
              if [ -f "$shot" ]; then gh release upload "$TAG" "$shot" --clobber --repo "$GITHUB_REPOSITORY"; fi
            done
          fi
